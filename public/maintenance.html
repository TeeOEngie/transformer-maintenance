<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ประวัติซ่อมบำรุง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
    .hover-lift {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hover-lift:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    /* ปุ่มหลักของระบบ: พื้นฟ้า ตัวดำหนา ชี้แล้วเป็นพื้นดำ ตัวฟ้า */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #38bdf8;                    /* ฟ้าเดียวกับโลโก้ CoolTrack */
      color: #000;
      font-weight: 700;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      box-shadow: inset 0 0 0 1.5px #38bdf8;  /* ขอบฟ้า (กลืนตอนปกติ เห็นเป็นกรอบตอนเป็นพื้นดำ) */
      white-space: nowrap;                    /* ข้อความไม่ตกบรรทัด */
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn-primary:hover {
      background: #000;
      color: #38bdf8;
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    /* ให้คลาส hidden ของ Tailwind ยังซ่อนปุ่มได้ */
    .btn-primary.hidden {
      display: none;
    }
    .btn-primary svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="bg-sky-50 min-h-screen">

  <!-- หน้านี้ก็อยู่ลึก (กดจากเครื่องแอร์เข้ามา) เลยใช้ header แบบเดียวกับ units.html -->
  <header class="bg-black text-sky-400 p-6 shadow-md border-b-4 border-sky-500 flex justify-between items-center">
    <div>
      <a href="javascript:history.back()" class="text-gray-300 text-sm hover:underline">&larr; กลับหน้าเครื่องปรับอากาศ</a>
      <h1 id="pageTitle" class="text-2xl font-bold mt-1">ประวัติซ่อมบำรุง</h1>
      <!-- ชื่อบริษัท + ตำแหน่งติดตั้ง ใต้หัวข้อ -->
      <p id="unitInfo" class="text-sm text-gray-300 mt-1"></p>
    </div>
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-sky-500 flex items-center justify-center font-bold text-black flex-shrink-0">
        <span id="userInitial">-</span>
      </div>
      <div>
        <p id="userInfo" class="text-sm font-medium text-white">กำลังโหลด...</p>
        <p id="userRole" class="text-xs text-gray-300"></p>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-6">

    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold text-slate-800">ประวัติการซ่อมบำรุงทั้งหมด</h2>
      <button onclick="openAddModal()" class="btn-primary">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
        บันทึกงานซ่อม
      </button>
    </div>

    <!-- การ์ดประวัติซ่อมแต่ละใบ โผล่มาตรงนี้ผ่าน js -->
    <div id="recordList" class="space-y-3"></div>

    <p id="emptyMsg" class="text-gray-400 text-center py-8 hidden">ยังไม่มีประวัติการซ่อมบำรุง</p>

  </main>

  <!-- [ใหม่] รายชื่ออุปกรณ์จากรายการราคา ให้ช่องชื่ออุปกรณ์เด้งรายการให้เลือก -->
  <datalist id="partOptions"></datalist>

  <!-- modal ฟอร์มบันทึกงานซ่อม (เลื่อนขึ้นลงได้ถ้ายาวเกินจอ) -->
  <div id="formModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <h3 class="text-lg font-semibold mb-4">บันทึกงานซ่อมบำรุงใหม่</h3>

      <form id="maintenanceForm" class="space-y-3">
        <div>
          <label class="block text-sm text-gray-600 mb-1">วันที่ซ่อม</label>
          <input type="date" id="formDate" required class="w-full border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">ประเภทงาน</label>
          <select id="formType" class="w-full border rounded px-3 py-2">
            <option value="ตรวจเช็ค">ตรวจเช็ค</option>
            <option value="ซ่อมภายใน">ซ่อมภายใน</option>
            <option value="ซ่อมภายนอก">ซ่อมภายนอก</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">ช่างผู้ซ่อม</label>
          <select id="formTechnician" class="w-full border rounded px-3 py-2">
            <!-- รายชื่อช่างจะถูกเติมตรงนี้ทุกครั้งที่เปิดฟอร์ม -->
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">รายละเอียดปัญหา</label>
          <textarea id="formProblem" rows="2" class="w-full border rounded px-3 py-2"></textarea>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">วิธีแก้ไข / สิ่งที่ทำ</label>
          <textarea id="formAction" rows="2" class="w-full border rounded px-3 py-2"></textarea>
        </div>

        <!-- [ใหม่] อุปกรณ์ที่ใช้ ใส่ได้หลายรายการ เว้นว่างได้ -->
        <div>
          <label class="block text-sm text-gray-600 mb-1">อุปกรณ์ที่ใช้ (ถ้ามี)</label>
          <div id="partRows" class="space-y-2"></div>
          <button type="button" onclick="addPartRow()" class="mt-2 text-sm text-sky-600 hover:text-sky-800">+ เพิ่มอุปกรณ์</button>
        </div>

        <div>
          <label class="block text-sm text-gray-600 mb-1">สถานะ</label>
          <select id="formStatus" class="w-full border rounded px-3 py-2">
            <option value="เสร็จสิ้น">เสร็จสิ้น</option>
            <option value="รอดำเนินการ">รอดำเนินการ</option>
          </select>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded border">ยกเลิก</button>
          <!-- ปุ่มบันทึกในฟอร์ม ใช้แบบเดียวกับปุ่มยกเลิก -->
          <button type="submit" id="saveBtn" class="px-4 py-2 rounded border">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // เอา id กับรหัสเครื่องจาก url ที่ส่งมาจากหน้าเครื่องแอร์
    const urlParams = new URLSearchParams(window.location.search);
    const acUnitId = urlParams.get('id');
    const unitCode = urlParams.get('code');

    let currentUserRole = null;
    let priceList = []; // [ใหม่] รายการราคาทั้งหมด (ใช้เติมรายชื่ออุปกรณ์ + หาหน่วย)

    // โชว์รหัสเครื่องจาก url ไปก่อน ระหว่างรอข้อมูลจริงจาก server
    document.getElementById('pageTitle').textContent = `ประวัติซ่อมบำรุง: ${unitCode || ''}`;

    // กันข้อความที่ผู้ใช้พิมพ์ไปทำให้ HTML พัง
    function escapeHtml(text) {
      return String(text == null ? '' : text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ดึงข้อมูลเครื่อง (รหัส ชื่อบริษัท ตำแหน่ง) จาก server มาโชว์ใต้หัวข้อ
    async function loadUnitInfo() {
      const response = await fetch(`/api/ac-units/${acUnitId}`);
      if (!response.ok) return; // ดึงไม่ได้ก็ปล่อยหัวข้อไว้แบบเดิม

      const unit = await response.json();

      document.getElementById('pageTitle').textContent = `ประวัติซ่อมบำรุง: ${unit.code}`;

      // ต่อชื่อบริษัทกับตำแหน่งด้วยจุดกลาง (ถ้าไม่มีตำแหน่งก็โชว์แค่บริษัท)
      const parts = [unit.client_company, unit.location].filter(Boolean);
      document.getElementById('unitInfo').textContent = parts.join(' · ');
    }

    // [ใหม่] โหลดรายการราคา แล้วเอาเฉพาะประเภท "อุปกรณ์" ใส่ใน datalist ให้ช่างเลือก
    async function loadPriceList() {
      const response = await fetch('/api/price-list');
      if (!response.ok) return; // โหลดไม่ได้ ช่างยังพิมพ์ชื่อเองได้

      priceList = await response.json();

      document.getElementById('partOptions').innerHTML = priceList
        .filter(p => p.item_type === 'part')
        .map(p => `<option value="${escapeHtml(p.name)}"></option>`)
        .join('');
    }

    // [ใหม่] หาหน่วยของอุปกรณ์จากชื่อ (ไม่เจอ = ไม่มีหน่วย เช่นพิมพ์ชื่อเอง)
    function unitOf(name) {
      const found = priceList.find(p => p.name === name.trim());
      return found ? found.unit : '';
    }

    // [ใหม่] เพิ่มแถวอุปกรณ์ 1 แถว: ช่องชื่อ (เลือกจากรายการหรือพิมพ์เอง) + จำนวน + หน่วย + ปุ่มลบ
    function addPartRow() {
      const row = document.createElement('div');
      row.className = 'part-row flex items-center gap-2';
      row.innerHTML = `
        <input type="text" list="partOptions" placeholder="พิมพ์หรือเลือกอุปกรณ์"
               class="part-name flex-1 min-w-0 border rounded px-3 py-2">
        <input type="number" min="0.01" step="any" value="1"
               class="part-qty w-20 border rounded px-2 py-2 text-right">
        <span class="part-unit w-12 text-sm text-gray-500"></span>
        <button type="button" title="ลบอุปกรณ์นี้" class="text-gray-400 hover:text-red-500 flex-shrink-0">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      `;

      // พิมพ์/เลือกชื่อแล้วโชว์หน่วยทันที (เช่น เมตร, ปอนด์)
      const nameInput = row.querySelector('.part-name');
      nameInput.addEventListener('input', () => {
        row.querySelector('.part-unit').textContent = unitOf(nameInput.value);
      });

      // ปุ่มกากบาท ลบแถวนี้ทิ้ง
      row.querySelector('button').addEventListener('click', () => row.remove());

      document.getElementById('partRows').appendChild(row);
    }

    // [ใหม่] รวบรวมอุปกรณ์จากทุกแถว (แถวที่ไม่ได้ใส่ชื่อจะถูกข้าม)
    function collectParts() {
      return Array.from(document.querySelectorAll('#partRows .part-row'))
        .map(row => ({
          description: row.querySelector('.part-name').value.trim(),
          quantity: Number(row.querySelector('.part-qty').value)
        }))
        .filter(p => p.description);
    }

    // โหลดรายชื่อช่างมาใส่ dropdown ทุกครั้งที่เปิดฟอร์ม กันกรณีมีช่างใหม่เพิ่มมาทีหลัง
    async function loadTechnicians() {
      const response = await fetch('/api/technicians');
      const data = await response.json();

      const select = document.getElementById('formTechnician');
      select.innerHTML = '';

      data.forEach(tech => {
        const option = document.createElement('option');
        option.value = tech.id;
        option.textContent = tech.full_name;
        select.appendChild(option);
      });
    }

    // [ใหม่] ข้อความอุปกรณ์บนการ์ด เช่น "ท่อน้ำทิ้ง 3 เมตร, คาปาซิเตอร์ 1 ชิ้น"
    // ไม่โชว์รายการค่าแรงที่แอดมินเพิ่มตอนออกใบ เพราะการ์ดนี้บอกเฉพาะของที่ใช้
    function partsText(items) {
      const laborNames = priceList.filter(p => p.item_type === 'labor').map(p => p.name);
      return (items || [])
        .filter(i => !laborNames.includes(i.description) && !i.description.startsWith('ค่าแรง'))
        .map(i => `${escapeHtml(i.description)} ${Number(i.quantity)} ${escapeHtml(unitOf(i.description))}`.trim())
        .join(', ');
    }

    async function loadRecords() {
      const response = await fetch(`/api/maintenance/${acUnitId}`);
      const data = await response.json();

      const recordList = document.getElementById('recordList');
      const emptyMsg = document.getElementById('emptyMsg');
      recordList.innerHTML = '';

      if (data.length === 0) {
        emptyMsg.classList.remove('hidden');
        return;
      }
      emptyMsg.classList.add('hidden');

      data.forEach(item => {
        // สีป้ายประเภทงาน แยก 3 สีไม่ซ้ำกับสีอื่นในระบบ
        let typeColor = 'bg-orange-100 text-orange-700';
        if (item.maintenance_type === 'ซ่อมภายใน') typeColor = 'bg-red-100 text-red-700';
        else if (item.maintenance_type === 'ซ่อมภายนอก') typeColor = 'bg-purple-100 text-purple-700';

        let statusColor = item.status === 'เสร็จสิ้น' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700';

        // ชื่อช่างมาจาก profiles ที่ join มาตอนเรียก api ถ้าไม่มีก็โชว์ขีดไว้
        const technicianName = item.profiles ? item.profiles.full_name : '-';
        const parts = partsText(item.repair_items); // [ใหม่]

        const card = document.createElement('div');
        card.className = 'hover-lift bg-white rounded-lg shadow p-4 transition';
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <span class="px-2 py-1 rounded-full text-xs ${typeColor}">${item.maintenance_type}</span>
              <span class="px-2 py-1 rounded-full text-xs ${statusColor} ml-1">${item.status}</span>
            </div>
            <span class="text-sm text-gray-400">${item.maintenance_date}</span>
          </div>
          <p class="text-sm text-gray-700"><b>ช่างผู้ซ่อม:</b> ${escapeHtml(technicianName)}</p>
          <p class="text-sm text-gray-700"><b>ปัญหา:</b> ${escapeHtml(item.problem_description || '-')}</p>
          <p class="text-sm text-gray-700"><b>การแก้ไข:</b> ${escapeHtml(item.action_taken || '-')}</p>
          ${parts ? `<p class="text-sm text-gray-700"><b>อุปกรณ์ที่ใช้:</b> ${parts}</p>` : ''}
          ${currentUserRole === 'admin' ? `
            <div class="text-right mt-2">
              <button onclick="deleteRecord(${item.id})" class="text-red-600 text-sm hover:underline">ลบรายการนี้</button>
            </div>
          ` : ''}
        `;
        recordList.appendChild(card);
      });
    }

    function openAddModal() {
      document.getElementById('maintenanceForm').reset();
      document.getElementById('partRows').innerHTML = ''; // [ใหม่] ล้างแถวอุปกรณ์เก่า
      addPartRow();                                        // [ใหม่] เริ่มด้วยแถวว่าง 1 แถว
      loadTechnicians();
      document.getElementById('formModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('formModal').classList.add('hidden');
    }

    document.getElementById('maintenanceForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const parts = collectParts();

      // [ใหม่] เช็คจำนวนอุปกรณ์ต้องมากกว่า 0
      if (parts.some(p => !(p.quantity > 0))) {
        alert('จำนวนอุปกรณ์ต้องมากกว่า 0');
        return;
      }

      const payload = {
        ac_unit_id: acUnitId,
        technician: document.getElementById('formTechnician').value,
        maintenance_date: document.getElementById('formDate').value,
        maintenance_type: document.getElementById('formType').value,
        problem_description: document.getElementById('formProblem').value,
        action_taken: document.getElementById('formAction').value,
        status: document.getElementById('formStatus').value,
        parts: parts // [ใหม่] ส่งอุปกรณ์ไปด้วย server จะแยกไปเก็บเอง
      };

      // ปิดปุ่มระหว่างบันทึก กันกดซ้ำ
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;

      const response = await fetch('/api/maintenance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      saveBtn.disabled = false;

      // [ใหม่] ถ้าบันทึกไม่สำเร็จ บอกผู้ใช้ (เดิมเงียบไปเฉยๆ)
      if (!response.ok) {
        const result = await response.json().catch(() => ({}));
        alert(result.error || 'บันทึกไม่สำเร็จ');
        return;
      }

      closeModal();
      loadRecords();
    });

    async function deleteRecord(id) {
      if (!confirm('ยืนยันการลบประวัติซ่อมนี้หรือไม่?')) return;
      await fetch(`/api/maintenance/${id}`, { method: 'DELETE' });
      loadRecords();
    }

    async function checkAuth() {
      const response = await fetch('/api/me');
      if (!response.ok) {
        window.location.href = 'login.html';
        return;
      }
      const user = await response.json();
      currentUserRole = user.role;

      document.getElementById('userInfo').textContent = user.full_name;
      document.getElementById('userRole').textContent = user.role === 'admin' ? 'แอดมิน' : 'ช่างซ่อมบำรุง';
      document.getElementById('userInitial').textContent = user.role === 'admin' ? 'A' : 'T';

      loadUnitInfo();         // โหลดชื่อบริษัท/ตำแหน่ง
      await loadPriceList();  // [ใหม่] โหลดรายการราคาก่อน การ์ดจะได้โชว์หน่วยของอุปกรณ์ถูก
      loadRecords();
    }

    checkAuth();

    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        checkAuth();
      }
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ประวัติซ่อมบำรุง</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 min-h-screen">

  <!-- ===== header ด้านบน ===== -->
  <!-- หน้านี้ไม่ใส่ปุ่มออกจากระบบ แต่ยังโชว์ชื่อคนที่ login อยู่ -->
  <header class="bg-black text-sky-400 p-6 shadow-md border-b-4 border-sky-500 flex justify-between items-center">
    <div>
      <a href="javascript:history.back()" class="text-gray-300 text-sm hover:underline">&larr; กลับหน้าเครื่องปรับอากาศ</a>
      <h1 id="pageTitle" class="text-2xl font-bold mt-1">ประวัติซ่อมบำรุง</h1>
    </div>
    <div class="text-right">
      <p id="userInfo" class="text-sm text-gray-300">กำลังโหลด...</p>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-6">

    <!-- ===== หัวข้อ + ปุ่มบันทึกงานซ่อม ===== -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold text-slate-800">ประวัติการซ่อมบำรุงทั้งหมด</h2>
      <button onclick="openAddModal()" class="bg-sky-500 hover:bg-sky-600 text-black font-semibold px-4 py-2 rounded-lg shadow">
        + บันทึกงานซ่อม
      </button>
    </div>

    <!-- การ์ดประวัติซ่อมจะถูกสร้างเพิ่มตรงนี้ด้วย js -->
    <div id="recordList" class="space-y-3"></div>

    <p id="emptyMsg" class="text-gray-400 text-center py-8 hidden">ยังไม่มีประวัติการซ่อมบำรุง</p>

  </main>

  <!-- ===== modal ฟอร์มบันทึกงานซ่อม ===== -->
  <div id="formModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md">
      <h3 class="text-lg font-semibold mb-4">บันทึกงานซ่อมบำรุงใหม่</h3>

      <form id="maintenanceForm" class="space-y-3">
        <div>
          <label class="block text-sm text-gray-600 mb-1">วันที่ซ่อม</label>
          <input type="date" id="formDate" required class="w-full border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">ประเภทงาน</label>
          <select id="formType" class="w-full border rounded px-3 py-2">
            <option value="ตรวจเช็ค">ตรวจเช็ค</option>
            <option value="ซ่อมภายใน">ซ่อมภายใน</option>
            <option value="ซ่อมภายนอก">ซ่อมภายนอก</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">ช่างผู้ซ่อม</label>
          <select id="formTechnician" class="w-full border rounded px-3 py-2">
            <!-- รายชื่อช่างจะถูกเติมตรงนี้ด้วย js ตอนเปิดฟอร์ม -->
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">รายละเอียดปัญหา</label>
          <textarea id="formProblem" rows="2" class="w-full border rounded px-3 py-2"></textarea>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">วิธีแก้ไข / สิ่งที่ทำ</label>
          <textarea id="formAction" rows="2" class="w-full border rounded px-3 py-2"></textarea>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">สถานะ</label>
          <select id="formStatus" class="w-full border rounded px-3 py-2">
            <option value="เสร็จสิ้น">เสร็จสิ้น</option>
            <option value="รอดำเนินการ">รอดำเนินการ</option>
          </select>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded border">ยกเลิก</button>
          <button type="submit" class="px-4 py-2 rounded bg-sky-500 text-black font-semibold hover:bg-sky-600">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ดึง id กับรหัสเครื่องจาก url ที่ส่งมาจากหน้า units
    const urlParams = new URLSearchParams(window.location.search);
    const acUnitId = urlParams.get('id');
    const unitCode = urlParams.get('code');

    let currentUserRole = null;

    document.getElementById('pageTitle').textContent = `ประวัติซ่อมบำรุง: ${unitCode || ''}`;

    // ===== โหลดรายชื่อช่างมาใส่ dropdown =====
    async function loadTechnicians() {
      const response = await fetch('/api/technicians');
      const data = await response.json();

      const select = document.getElementById('formTechnician');
      select.innerHTML = '';

      data.forEach(tech => {
        const option = document.createElement('option');
        option.value = tech.id;
        option.textContent = tech.full_name;
        select.appendChild(option);
      });
    }

    // ===== โหลดประวัติซ่อมของเครื่องนี้ =====
    async function loadRecords() {
      const response = await fetch(`/api/maintenance/${acUnitId}`);
      const data = await response.json();

      const recordList = document.getElementById('recordList');
      const emptyMsg = document.getElementById('emptyMsg');
      recordList.innerHTML = '';

      if (data.length === 0) {
        emptyMsg.classList.remove('hidden');
        return;
      }
      emptyMsg.classList.add('hidden');

      data.forEach(item => {
        // สีป้ายประเภทงาน แยกกัน 3 สี ไม่ใช้ฟ้าเพราะเป็นสีธีมเว็บไปแล้ว
        let typeColor = 'bg-orange-100 text-orange-700'; // ตรวจเช็ค
        if (item.maintenance_type === 'ซ่อมภายใน') typeColor = 'bg-red-100 text-red-700';
        else if (item.maintenance_type === 'ซ่อมภายนอก') typeColor = 'bg-purple-100 text-purple-700';

        let statusColor = item.status === 'เสร็จสิ้น' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700';

        // ชื่อช่างดึงมาจาก profiles ที่ join มาด้วยตอนเรียก api ถ้าไม่มีให้โชว์ขีด
        const technicianName = item.profiles ? item.profiles.full_name : '-';

        const card = document.createElement('div');
        card.className = 'bg-white rounded-lg shadow p-4';
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <span class="px-2 py-1 rounded-full text-xs ${typeColor}">${item.maintenance_type}</span>
              <span class="px-2 py-1 rounded-full text-xs ${statusColor} ml-1">${item.status}</span>
            </div>
            <span class="text-sm text-gray-400">${item.maintenance_date}</span>
          </div>
          <p class="text-sm text-gray-700"><b>ช่างผู้ซ่อม:</b> ${technicianName}</p>
          <p class="text-sm text-gray-700"><b>ปัญหา:</b> ${item.problem_description || '-'}</p>
          <p class="text-sm text-gray-700"><b>การแก้ไข:</b> ${item.action_taken || '-'}</p>
          ${currentUserRole === 'admin' ? `
            <div class="text-right mt-2">
              <button onclick="deleteRecord(${item.id})" class="text-red-600 text-sm hover:underline">ลบรายการนี้</button>
            </div>
          ` : ''}
        `;
        recordList.appendChild(card);
      });
    }

    function openAddModal() {
      document.getElementById('maintenanceForm').reset();
      loadTechnicians(); // โหลดรายชื่อช่างใหม่ทุกครั้งที่เปิดฟอร์ม
      document.getElementById('formModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('formModal').classList.add('hidden');
    }

    // ===== บันทึกฟอร์มงานซ่อมใหม่ =====
    document.getElementById('maintenanceForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        ac_unit_id: acUnitId,
        technician: document.getElementById('formTechnician').value,
        maintenance_date: document.getElementById('formDate').value,
        maintenance_type: document.getElementById('formType').value,
        problem_description: document.getElementById('formProblem').value,
        action_taken: document.getElementById('formAction').value,
        status: document.getElementById('formStatus').value,
      };

      await fetch('/api/maintenance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      closeModal();
      loadRecords();
    });

    // ===== ลบประวัติซ่อม (เฉพาะ admin) =====
    async function deleteRecord(id) {
      if (!confirm('ยืนยันการลบประวัติซ่อมนี้หรือไม่?')) return;
      await fetch(`/api/maintenance/${id}`, { method: 'DELETE' });
      loadRecords();
    }

    // ===== เช็ค login =====
    async function checkAuth() {
      const response = await fetch('/api/me');
      if (!response.ok) {
        window.location.href = 'login.html';
        return;
      }
      const user = await response.json();
      currentUserRole = user.role;

      document.getElementById('userInfo').textContent = `${user.full_name} (${user.role === 'admin' ? 'แอดมิน' : 'ช่างซ่อมบำรุง'})`;

      loadRecords();
    }

    checkAuth();

    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        checkAuth();
      }
    });
  </script>

</body>
</html>

      </svg>

    <nav class="flex-1 p-4 space-y-1">
      <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

        </svg>
        หน้าหลัก
      </a>
      <a href="companies.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2M5 21H3m16 0h-2M9 7h1m-1 4h1m-1 4h1m4-8h1m-1 4h1m-1 4h1" />
        </svg>
        บริษัทลูกค้า
      </a>
      <a href="activity.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
        งานซ่อมล่าสุด

      <a href="schedule.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        แผนตรวจเช็ค
      </a>
      <a href="report.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        ออกรายงาน
      </a>
      <!-- หน้านี้ จึงเป็นสีฟ้า -->
      <a href="invoices.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-sky-500 text-black font-semibold">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z" />
        </svg>
        ใบเรียกเก็บเงิน
      </a>
    </nav>

    <div class="p-4 border-t border-gray-700">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-9 h-9 rounded-full bg-sky-500 flex items-center justify-center font-bold text-black">A</div>
        <div>
          <p id="userInfo" class="text-sm font-medium">กำลังโหลด...</p>
          <p class="text-xs text-gray-400">แอดมิน</p>
        </div>
      </div>
      <button onclick="logout()" class="flex items-center gap-2 text-sm text-gray-400 hover:text-red-400 transition">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        ออกจากระบบ
      </button>
    </div>
  </aside>

  <div class="flex-1">
    <header class="bg-white shadow-md p-6 border-b-4 border-sky-500">
      <h1 class="text-xl font-bold text-slate-800">ใบเรียกเก็บเงิน</h1>
    </header>

    <main class="max-w-5xl mx-auto p-6">

      <!-- ตัวกรองบริษัท + ปุ่มออกใบใหม่ -->
      <div class="flex flex-wrap items-end gap-4 mb-4">
        <label class="flex flex-col text-sm text-gray-600">
          บริษัท
          <select id="companyFilter" class="mt-1 bg-white border border-gray-300 rounded-lg px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500">
            <option value="">ทุกบริษัท</option>
          </select>
        </label>
        <a href="report.html?mode=invoice" class="ml-auto bg-sky-500 text-black font-semibold px-4 py-2 rounded-lg hover:bg-sky-400 transition">ออกใบใหม่</a>
      </div>

      <!-- สรุปจำนวนใบและยอดรวม ตามตัวกรองที่เลือก -->
      <p id="summary" class="text-sm text-gray-600 mb-3"></p>

      <!-- ตารางรายการใบ -->
      <div id="tableWrap" class="hidden bg-white rounded-lg shadow overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b-2 border-gray-200 text-left text-gray-600">
              <th class="px-4 py-3">เลขที่</th>
              <th class="px-4 py-3">บริษัท</th>
              <th class="px-4 py-3">วันที่ให้บริการ</th>
              <th class="px-4 py-3 text-right">ยอดสุทธิ (บาท)</th>
            </tr>
          </thead>
          <tbody id="invoiceRows"></tbody>
        </table>
      </div>

      <p id="emptyMsg" class="hidden text-gray-400 text-center py-12"></p>

    </main>
  </div>

  <script>
    const companyFilter = document.getElementById('companyFilter');

    // กันข้อความพิเศษทำให้ HTML พัง
    function escapeHtml(text) {
      return String(text == null ? '' : text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // แสดงเงินแบบ 1,234.50
    function money(n) {
      return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // แปลง 2026-09-23 เป็น "23 ก.ย. 2569"
    function thaiDate(dateStr) {
      return new Date(dateStr + 'T00:00:00').toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    // ดึงรายชื่อบริษัทใส่ dropdown (ใช้ API เดียวกับหน้าบริษัทลูกค้า)
    async function loadCompanyOptions() {
      const response = await fetch('/api/companies');
      if (!response.ok) return;
      const companies = await response.json();

      companies
        .map(c => c.client_company)
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b, 'th'))
        .forEach(name => {
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          companyFilter.appendChild(option);
        });
    }

    // ดึงรายการใบตามบริษัทที่เลือก แล้ววาดตาราง
    async function loadInvoices() {
      let url = '/api/invoices';
      if (companyFilter.value) url += '?company=' + encodeURIComponent(companyFilter.value);

      const response = await fetch(url);
      const tableWrap = document.getElementById('tableWrap');
      const emptyMsg = document.getElementById('emptyMsg');
      const summary = document.getElementById('summary');

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        tableWrap.classList.add('hidden');
        summary.textContent = '';
        emptyMsg.textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + (err.error || response.status);
        emptyMsg.classList.remove('hidden');
        return;
      }

      const invoices = await response.json();

      // สรุป: จำนวนใบ + ยอดรวมทุกใบ
      const grandTotal = invoices.reduce((sum, inv) => sum + Number(inv.total), 0);
      summary.textContent = `ทั้งหมด ${invoices.length} ใบ | ยอดรวม ${money(grandTotal)} บาท`;

      if (invoices.length === 0) {
        tableWrap.classList.add('hidden');
        emptyMsg.textContent = 'ยังไม่มีใบเรียกเก็บเงิน';
        emptyMsg.classList.remove('hidden');
        return;
      }
      emptyMsg.classList.add('hidden');
      tableWrap.classList.remove('hidden');

      // วาดแถว กดแถวแล้วเปิดใบนั้นในหน้า report.html
      document.getElementById('invoiceRows').innerHTML = invoices.map(inv => `
        <tr onclick="window.location.href='report.html?invoice=${inv.id}'"
            class="border-b border-gray-100 hover:bg-sky-50 cursor-pointer transition">
          <td class="px-4 py-3 font-semibold text-slate-800">${escapeHtml(inv.invoice_no)}</td>
          <td class="px-4 py-3 text-gray-700">${escapeHtml(inv.client_company)}</td>
          <td class="px-4 py-3 text-gray-700">${thaiDate(inv.service_date)}</td>
          <td class="px-4 py-3 text-right text-slate-800">${money(inv.total)}</td>
        </tr>`).join('');
    }

    // เปลี่ยนบริษัทแล้วโหลดใหม่ทันที
    companyFilter.addEventListener('change', loadInvoices);

    async function checkAuth() {
      const response = await fetch('/api/me');

      if (!response.ok) {
        window.location.href = 'login.html';
        return;
      }

      const user = await response.json();

      if (user.role !== 'admin') {
        window.location.href = 'technician.html';
        return;
      }

      document.getElementById('userInfo').textContent = user.full_name;
      await loadCompanyOptions();
      loadInvoices();
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = 'login.html';
    }

    checkAuth();

    window.addEventListener('pageshow', function (event) {
      if (event.persisted) checkAuth();
    });
  </script>

</body>
</html>

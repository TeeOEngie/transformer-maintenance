<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>หน้าหลัก</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 min-h-screen flex">

  <!-- ===== sidebar เมนูซ้าย ===== -->
  <aside class="w-56 bg-black text-white min-h-screen p-4 flex-shrink-0">
    <h2 class="text-sky-400 font-bold text-lg mb-6">❄️ CoolTrack</h2>
    <nav class="space-y-2">
      <a href="index.html" class="block px-3 py-2 rounded bg-sky-500 text-black font-semibold">🏠 หน้าหลัก</a>
      <a href="companies.html" class="block px-3 py-2 rounded hover:bg-gray-800">🏢 บริษัทลูกค้า</a>
      <a href="activity.html" class="block px-3 py-2 rounded hover:bg-gray-800">📋 งานซ่อมล่าสุด</a>
      <a href="schedule.html" class="block px-3 py-2 rounded hover:bg-gray-800">📅 แผนตรวจเช็ค</a>
    </nav>
  </aside>

  <!-- ===== เนื้อหาหลัก ===== -->
  <div class="flex-1">
    <header class="bg-white shadow-md p-6 flex justify-between items-center border-b-4 border-sky-500">
      <div>
        <h1 class="text-xl font-bold text-slate-800">❄️ ระบบเก็บประวัติการซ่อมเครื่องปรับอากาศ</h1>
        <p class="text-sm text-gray-500">บริษัท คูลเทค แอร์เซอร์วิส จำกัด</p>
      </div>
      <div class="text-right">
        <p id="userInfo" class="text-sm text-gray-500">กำลังโหลด...</p>
        <button onclick="logout()" class="mt-1 bg-red-600 hover:bg-red-700 text-white text-sm px-3 py-1 rounded">
          ออกจากระบบ
        </button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto p-6">

      <h1 class="text-xl font-bold text-slate-800 mb-4">ข่าวสารและประกาศ</h1>

      <div class="bg-white rounded-lg shadow p-5">
        <h2 class="text-lg font-semibold text-slate-800 mb-3">📅 แผนตรวจเช็คที่ใกล้ถึงนี้</h2>
        <div id="scheduleList" class="space-y-2"></div>
        <p id="emptyMsg" class="text-gray-400 text-sm hidden">ยังไม่มีแผนตรวจเช็คที่ประกาศไว้</p>
      </div>

    </main>
  </div>

  <script>
    // ดึงแผนตรวจเช็คที่ประกาศไว้ มาแสดงในหน้าหลัก
    async function loadSchedules() {
      const response = await fetch('/api/schedules');
      const data = await response.json();

      const scheduleList = document.getElementById('scheduleList');
      const emptyMsg = document.getElementById('emptyMsg');
      scheduleList.innerHTML = '';

      if (data.length === 0) {
        emptyMsg.classList.remove('hidden');
        return;
      }
      emptyMsg.classList.add('hidden');

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-sky-50 border border-sky-200 rounded-lg p-3';
        card.innerHTML = `
          <p class="font-semibold text-slate-800">${item.client_company}</p>
          <p class="text-sm text-sky-700">วันที่ ${item.scheduled_date}</p>
          ${item.note ? `<p class="text-sm text-gray-500 mt-1">${item.note}</p>` : ''}
        `;
        scheduleList.appendChild(card);
      });
    }

    async function checkAuth() {
      const response = await fetch('/api/me');

      if (!response.ok) {
        window.location.href = 'login.html';
        return;
      }

      const user = await response.json();

      if (user.role !== 'admin') {
        window.location.href = 'technician.html';
        return;
      }

      document.getElementById('userInfo').textContent = `${user.full_name} (แอดมิน)`;
      loadSchedules();
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = 'login.html';
    }

    checkAuth();

    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        checkAuth();
      }
    });
  </script>

</body>
</html>

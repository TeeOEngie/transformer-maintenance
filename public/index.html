<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบจัดการงานซ่อมเครื่องปรับอากาศ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 min-h-screen">

  <!-- ===== header ด้านบนสุด ===== -->
  <header class="bg-black text-sky-400 p-6 shadow-md flex justify-between items-center border-b-4 border-sky-500">
    <div>
      <h1 class="text-2xl font-bold">❄️ ระบบจัดการงานซ่อมเครื่องปรับอากาศ</h1>
      <p class="text-gray-300">บริษัท คูลเทค แอร์เซอร์วิส จำกัด</p>
    </div>
    <div class="text-right">
      <p id="userInfo" class="text-sm text-gray-300">กำลังโหลด...</p>
      <button onclick="logout()" class="mt-1 bg-red-600 hover:bg-red-700 text-white text-sm px-3 py-1 rounded">
        ออกจากระบบ
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-6">

    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold text-slate-800">รายชื่อบริษัทลูกค้า</h2>
      <a href="activity.html" class="text-sm bg-black text-sky-400 px-4 py-2 rounded-lg hover:bg-gray-800">
        📋 ดูงานซ่อมล่าสุด
      </a>
    </div>

    <!-- ตรงนี้จะเอาการ์ดบริษัทมาใส่ทีหลังด้วย js -->
    <div id="companyList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    </div>

  </main>

  <script>
    // ===== ฟังก์ชันโหลดรายชื่อบริษัท =====
    // ดึงรายชื่อบริษัทจาก api แล้วเอามาสร้างเป็นการ์ด
    async function loadCompanies() {
      const response = await fetch('/api/companies');
      const data = await response.json();

      const companyList = document.getElementById('companyList');
      companyList.innerHTML = '';

      data.forEach(company => {
        // ทำเป็น a tag เพื่อให้กดแล้วเด้งไปหน้า units ของบริษัทนั้นเลย
        const card = document.createElement('a');
        card.href = `units.html?company=${encodeURIComponent(company.client_company)}`;
        card.className = 'bg-white rounded-lg shadow p-5 hover:shadow-lg transition block border-l-4 border-sky-500';

        // เช็คว่าบริษัทนี้มีเครื่องต้องซ่อมหรือรอเปลี่ยนไหม ถ้ามีก็ขึ้น badge เตือน
        let badges = '';

        if (company.needRepairCount > 0) {
          badges += `<span class="bg-red-100 text-red-700 text-xs font-semibold px-2 py-1 rounded-full block mb-1">ต้องซ่อม ${company.needRepairCount} เครื่อง</span>`;
        }

        if (company.needReplaceCount > 0) {
          badges += `<span class="bg-yellow-100 text-yellow-700 text-xs font-semibold px-2 py-1 rounded-full block mb-1">รอเปลี่ยน ${company.needReplaceCount} เครื่อง</span>`;
        }

        // ถ้าไม่มีทั้งสองอย่างเลยแสดงว่าปกติหมด
        if (company.needRepairCount === 0 && company.needReplaceCount === 0) {
          badges = `<span class="bg-green-100 text-green-700 text-xs font-semibold px-2 py-1 rounded-full">ปกติทั้งหมด</span>`;
        }

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-semibold text-lg text-slate-800">${company.client_company}</h3>
              <p class="text-sm text-gray-500 mt-1">เครื่องปรับอากาศทั้งหมด ${company.total} เครื่อง</p>
            </div>
            <div class="text-right">
              ${badges}
            </div>
          </div>
        `;
        companyList.appendChild(card);
      });
    }

    // ===== เช็คสถานะ login =====
    // เช็คก่อนว่า login รึยัง ถ้ายังไม่ login เด้งไปหน้า login เลย
    async function checkAuth() {
      const response = await fetch('/api/me');

      if (!response.ok) {
        window.location.href = 'login.html';
        return;
      }

      const user = await response.json();

      // ถ้าไม่ใช่ admin ไม่ให้อยู่หน้านี้ ส่งไปหน้าช่างแทน
      if (user.role !== 'admin') {
        window.location.href = 'technician.html';
        return;
      }

      document.getElementById('userInfo').textContent = `${user.full_name} (แอดมิน)`;
      loadCompanies();
    }

    // ===== ฟังก์ชัน logout =====
    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = 'login.html';
    }

    checkAuth();

    // ===== กันเคส back cache =====
    // กันเคสกดย้อนกลับแล้วเจอหน้าเดิมค้างจาก cache ทั้งที่ logout ไปแล้ว
    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        checkAuth();
      }
    });
  </script>

</body>
</html>

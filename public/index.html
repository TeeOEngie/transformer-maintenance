<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบจัดการงานซ่อมเครื่องปรับอากาศ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-yellow-50 min-h-screen">

  <!-- ส่วนหัวเว็บ -->
  <header class="bg-black text-yellow-400 p-6 shadow-md flex justify-between items-center border-b-4 border-yellow-500">
    <div>
      <h1 class="text-2xl font-bold">❄️ ระบบจัดการงานซ่อมเครื่องปรับอากาศ</h1>
      <p class="text-gray-300">บริษัท คูลเทค แอร์เซอร์วิส จำกัด</p>
    </div>
    <div class="text-right">
      <p id="userInfo" class="text-sm text-gray-300">กำลังโหลด...</p>
      <button onclick="logout()" class="mt-1 bg-red-600 hover:bg-red-700 text-white text-sm px-3 py-1 rounded">
        ออกจากระบบ
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-6">

    <h2 class="text-xl font-semibold text-slate-800 mb-4">รายชื่อบริษัทลูกค้า</h2>

    <!-- รายชื่อบริษัท แสดงเป็นการ์ด -->
    <div id="companyList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- ข้อมูลจะถูกเติมตรงนี้ผ่าน JavaScript -->
    </div>

  </main>

  <script>
    // ฟังก์ชันดึงรายชื่อบริษัทลูกค้าทั้งหมด แล้วนำมาแสดงเป็นการ์ด
    async function loadCompanies() {
      const response = await fetch('/api/companies');
      const data = await response.json();

      const companyList = document.getElementById('companyList');
      companyList.innerHTML = '';

      data.forEach(company => {
        const card = document.createElement('a');
        // ส่งชื่อบริษัทไปหน้าถัดไปผ่าน URL
        card.href = `units.html?company=${encodeURIComponent(company.client_company)}`;
        card.className = 'bg-white rounded-lg shadow p-5 hover:shadow-lg transition block border-l-4 border-yellow-500';

        // สร้าง badge แยกกันตามประเภท แสดงเฉพาะที่มีจำนวนมากกว่า 0
let badges = '';

if (company.needRepairCount > 0) {
  badges += `<span class="bg-red-100 text-red-700 text-xs font-semibold px-2 py-1 rounded-full block mb-1">ต้องซ่อม ${company.needRepairCount} เครื่อง</span>`;
}

if (company.needReplaceCount > 0) {
  badges += `<span class="bg-yellow-100 text-yellow-700 text-xs font-semibold px-2 py-1 rounded-full block mb-1">รอเปลี่ยน ${company.needReplaceCount} เครื่อง</span>`;
}

// ถ้าไม่มีทั้งสองอย่าง แสดงว่าปกติทั้งหมด
if (company.needRepairCount === 0 && company.needReplaceCount === 0) {
  badges = `<span class="bg-green-100 text-green-700 text-xs font-semibold px-2 py-1 rounded-full">ปกติทั้งหมด</span>`;
}

card.innerHTML = `
  <div class="flex justify-between items-start">
    <div>
      <h3 class="font-semibold text-lg text-slate-800">${company.client_company}</h3>
      <p class="text-sm text-gray-500 mt-1">เครื่องปรับอากาศทั้งหมด ${company.total} เครื่อง</p>
    </div>
    <div class="text-right">
      ${badges}
    </div>
  </div>
`;
        companyList.appendChild(card);
      });
    }

        // ฟังก์ชันเช็คว่า Login อยู่หรือไม่ ก่อนแสดงเนื้อหาในหน้านี้
    async function checkAuth() {
      const response = await fetch('/api/me');

      if (!response.ok) {
        window.location.href = 'login.html';
        return;
      }

      const user = await response.json();

      // ถ้าเป็นช่าง ไม่ให้อยู่หน้านี้ ให้ไปหน้า technician.html แทน
      if (user.role !== 'admin') {
        window.location.href = 'technician.html';
        return;
      }

      document.getElementById('userInfo').textContent = `${user.full_name} (แอดมิน)`;

      loadCompanies();
    }

    // ฟังก์ชัน Logout
    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = 'login.html';
    }

    // เรียกเช็ค Login ทันทีที่หน้าเว็บเปิดขึ้นมา
    checkAuth();

    // ป้องกันปัญหา: กดปุ่มย้อนกลับแล้วเห็นหน้าเดิมค้างอยู่ทั้งที่ Logout ไปแล้ว
    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        checkAuth();
      }
    });
  </script>

</body>
</html>

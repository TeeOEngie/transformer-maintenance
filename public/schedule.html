<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>แผนตรวจเช็ค</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
    .hover-lift {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hover-lift:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-sky-50 min-h-screen flex">

  <aside class="w-64 bg-black text-white min-h-screen flex flex-col flex-shrink-0">

    <div class="p-5 flex items-center gap-3 border-b border-gray-700">
      <svg class="w-7 h-7 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z" />
      </svg>
      <h2 class="font-bold text-lg text-sky-400">CoolTrack</h2>
    </div>

    <nav class="flex-1 p-4 space-y-1">
      <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        หน้าหลัก
      </a>
      <a href="companies.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2M5 21H3m16 0h-2M9 7h1m-1 4h1m-1 4h1m4-8h1m-1 4h1m-1 4h1" />
        </svg>
        บริษัทลูกค้า
      </a>
      <a href="activity.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
        งานซ่อมล่าสุด
      </a>
      <a href="schedule.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-sky-500 text-black font-semibold">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        แผนตรวจเช็ค
      </a>
    </nav>

    <div class="p-4 border-t border-gray-700">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-9 h-9 rounded-full bg-sky-500 flex items-center justify-center font-bold text-black">A</div>
        <div>
          <p id="userInfo" class="text-sm font-medium">กำลังโหลด...</p>
          <p class="text-xs text-gray-400">แอดมิน</p>
        </div>
      </div>
      <button onclick="logout()" class="flex items-center gap-2 text-sm text-gray-400 hover:text-red-400 transition">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        ออกจากระบบ
      </button>
    </div>
  </aside>

  <div class="flex-1">
    <header class="bg-white shadow-md p-6 border-b-4 border-sky-500">
      <h1 class="text-xl font-bold text-slate-800">แผนตรวจเช็คแอร์ล่วงหน้า</h1>
    </header>

    <main class="max-w-3xl mx-auto p-6">

      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold text-slate-800">รายการแผนที่ประกาศไว้</h2>
        <button onclick="openAddModal()" class="flex items-center gap-2 bg-sky-500 hover:bg-sky-600 text-black font-semibold px-4 py-2.5 rounded-lg shadow transition">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          ประกาศแผนใหม่
        </button>
      </div>

      <div id="scheduleList" class="space-y-3"></div>

      <p id="emptyMsg" class="text-gray-400 text-center py-12 hidden">ยังไม่มีแผนตรวจเช็คที่ประกาศไว้</p>

    </main>
  </div>

  <!-- modal ฟอร์มประกาศแผนใหม่ -->
  <div id="formModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md">
      <h3 class="text-lg font-semibold mb-4">ประกาศแผนตรวจเช็คใหม่</h3>

      <form id="scheduleForm" class="space-y-3">
        <div>
          <label class="block text-sm text-gray-600 mb-1">บริษัทที่จะไปตรวจ</label>
          <select id="formCompany" required class="w-full border rounded px-3 py-2">
            <!-- เติมรายชื่อบริษัทตรงนี้ทุกครั้งที่เปิดฟอร์ม -->
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">วันที่นัดหมาย</label>
          <input type="date" id="formDate" required class="w-full border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">หมายเหตุ (ถ้ามี)</label>
          <textarea id="formNote" rows="2" class="w-full border rounded px-3 py-2"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded border">ยกเลิก</button>
          <button type="submit" class="px-4 py-2 rounded bg-sky-500 text-black font-semibold hover:bg-sky-600 transition">ประกาศ</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    async function loadCompanyOptions() {
      const response = await fetch('/api/companies');
      const data = await response.json();

      const select = document.getElementById('formCompany');
      select.innerHTML = '';

      data.forEach(company => {
        const option = document.createElement('option');
        option.value = company.client_company;
        option.textContent = company.client_company;
        select.appendChild(option);
      });
    }

    async function loadSchedules() {
      const response = await fetch('/api/schedules');
      const data = await response.json();

      const scheduleList = document.getElementById('scheduleList');
      const emptyMsg = document.getElementById('emptyMsg');
      scheduleList.innerHTML = '';

      if (data.length === 0) {
        emptyMsg.classList.remove('hidden');
        return;
      }
      emptyMsg.classList.add('hidden');

      data.forEach(item => {
        const card = document.createElement('div');
        // ขอบสีฟ้าซ้ายบอกว่าเป็นการ์ดแผนตรวจเช็ค ไอคอนปฏิทินช่วยให้ดูออกเร็วๆ
        card.className = 'hover-lift bg-white rounded-lg shadow p-4 flex justify-between items-start transition border-l-4 border-sky-500';
        card.innerHTML = `
          <div class="flex items-start gap-3">
            <svg class="w-5 h-5 text-sky-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <div>
              <p class="font-semibold text-slate-800">${item.client_company}</p>
              <p class="text-sm text-sky-700">วันที่ ${item.scheduled_date}</p>
              ${item.note ? `<p class="text-sm text-gray-500 mt-1">${item.note}</p>` : ''}
            </div>
          </div>
          <button onclick="deleteSchedule(${item.id})" class="text-gray-400 hover:text-red-600 p-1.5 rounded-lg hover:bg-red-50 transition flex-shrink-0">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        `;
        scheduleList.appendChild(card);
      });
    }

    function openAddModal() {
      document.getElementById('scheduleForm').reset();
      loadCompanyOptions();
      document.getElementById('formModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('formModal').classList.add('hidden');
    }

    document.getElementById('scheduleForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        client_company: document.getElementById('formCompany').value,
        scheduled_date: document.getElementById('formDate').value,
        note: document.getElementById('formNote').value,
      };

      await fetch('/api/schedules', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      closeModal();
      loadSchedules();
    });

    // ใช้ตอนตรวจเสร็จแล้วหรือยกเลิกแผน
    async function deleteSchedule(id) {
      if (!confirm('ยืนยันการลบแผนนี้หรือไม่?')) return;
      await fetch(`/api/schedules/${id}`, { method: 'DELETE' });
      loadSchedules();
    }

    async function checkAuth() {
      const response = await fetch('/api/me');

      if (!response.ok) {
        window.location.href = 'login.html';
        return;
      }

      const user = await response.json();

      if (user.role !== 'admin') {
        window.location.href = 'technician.html';
        return;
      }

      document.getElementById('userInfo').textContent = user.full_name;
      loadSchedules();
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = 'login.html';
    }

    checkAuth();

    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        checkAuth();
      }
    });
  </script>

</body>
</html>

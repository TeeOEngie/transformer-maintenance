<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>งานซ่อมล่าสุด</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
    .hover-lift {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hover-lift:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-sky-50 min-h-screen flex">

  <aside class="w-64 bg-black text-white min-h-screen flex flex-col flex-shrink-0">

    <div class="p-5 flex items-center gap-3 border-b border-gray-700">
      <svg class="w-7 h-7 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z" />
      </svg>
      <h2 class="font-bold text-lg text-sky-400">CoolTrack</h2>
    </div>

    <nav class="flex-1 p-4 space-y-1">
      <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        หน้าหลัก
      </a>
      <a href="companies.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2M5 21H3m16 0h-2M9 7h1m-1 4h1m-1 4h1m4-8h1m-1 4h1m-1 4h1" />
        </svg>
        บริษัทลูกค้า
      </a>
      <a href="activity.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-sky-500 text-black font-semibold">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
        งานซ่อมล่าสุด
      </a>
      <a href="schedule.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        แผนตรวจเช็ค
      </a>
    </nav>

    <div class="p-4 border-t border-gray-700">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-9 h-9 rounded-full bg-sky-500 flex items-center justify-center font-bold text-black">A</div>
        <div>
          <p id="userInfo" class="text-sm font-medium">กำลังโหลด...</p>
          <p class="text-xs text-gray-400">แอดมิน</p>
        </div>
      </div>
      <button onclick="logout()" class="flex items-center gap-2 text-sm text-gray-400 hover:text-red-400 transition">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        ออกจากระบบ
      </button>
    </div>
  </aside>

  <div class="flex-1">
    <header class="bg-white shadow-md p-6 border-b-4 border-sky-500">
      <h1 class="text-xl font-bold text-slate-800">งานซ่อมล่าสุด</h1>
    </header>

    <main class="max-w-4xl mx-auto p-6">

      <h2 class="text-xl font-semibold text-slate-800 mb-4">รายการบันทึกซ่อมล่าสุด (50 รายการ)</h2>

      <div id="feedList" class="space-y-3"></div>

      <p id="emptyMsg" class="text-gray-400 text-center py-12 hidden">ยังไม่มีการบันทึกซ่อมในระบบ</p>

    </main>
  </div>

  <script>
    // ดึงงานซ่อมล่าสุดข้ามทุกบริษัท เอาไว้ให้แอดมินดูภาพรวมได้เร็วๆ
    async function loadFeed() {
      const response = await fetch('/api/maintenance-feed');

      if (!response.ok) {
        window.location.href = 'index.html';
        return;
      }

      const data = await response.json();

      const feedList = document.getElementById('feedList');
      const emptyMsg = document.getElementById('emptyMsg');
      feedList.innerHTML = '';

      if (data.length === 0) {
        emptyMsg.classList.remove('hidden');
        return;
      }
      emptyMsg.classList.add('hidden');

      data.forEach(item => {
        // ข้อมูลพวกนี้ join มาจาก ac_units กับ profiles ตั้งแต่ตอนเรียก api แล้ว
        const unitCode = item.ac_units ? item.ac_units.code : '-';
        const companyName = item.ac_units ? item.ac_units.client_company : '-';
        const technicianName = item.profiles ? item.profiles.full_name : '-';

        let typeColor = 'bg-orange-100 text-orange-700';
        if (item.maintenance_type === 'ซ่อมภายใน') typeColor = 'bg-red-100 text-red-700';
        else if (item.maintenance_type === 'ซ่อมภายนอก') typeColor = 'bg-purple-100 text-purple-700';

        let statusColor = item.status === 'เสร็จสิ้น' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700';

        const card = document.createElement('a');
        // กดการ์ดแล้วพาไปหน้าเครื่องแอร์ของบริษัทนั้นเลย
        card.href = `units.html?company=${encodeURIComponent(companyName)}`;
        card.className = 'hover-lift bg-white rounded-lg shadow p-4 block transition';

        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div class="flex items-center gap-2">
              <span class="font-semibold text-slate-800">${unitCode}</span>
              <span class="text-sm text-gray-500">${companyName}</span>
            </div>
            <span class="text-sm text-gray-400">${item.maintenance_date}</span>
          </div>
          <div class="flex gap-1 mb-2">
            <span class="px-2 py-1 rounded-full text-xs ${typeColor}">${item.maintenance_type}</span>
            <span class="px-2 py-1 rounded-full text-xs ${statusColor}">${item.status}</span>
          </div>
          <p class="text-sm text-gray-700"><b>ช่างผู้ซ่อม:</b> ${technicianName}</p>
          <p class="text-sm text-gray-700"><b>ปัญหา:</b> ${item.problem_description || '-'}</p>
          <p class="text-sm text-gray-700"><b>การแก้ไข:</b> ${item.action_taken || '-'}</p>
        `;
        feedList.appendChild(card);
      });
    }

    async function checkAuth() {
      const response = await fetch('/api/me');

      if (!response.ok) {
        window.location.href = 'login.html';
        return;
      }

      const user = await response.json();

      if (user.role !== 'admin') {
        window.location.href = 'technician.html';
        return;
      }

      document.getElementById('userInfo').textContent = user.full_name;
      loadFeed();
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = 'login.html';
    }

    checkAuth();

    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        checkAuth();
      }
    });
  </script>

</body>
</html>

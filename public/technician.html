<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>งานที่ต้องดำเนินการ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 min-h-screen">

  <!-- ===== header เต็มความกว้าง อยู่บนสุด ===== -->
  <header class="bg-black text-sky-400 p-6 shadow-md flex justify-between items-center border-b-4 border-sky-500">
    <div>
      <h1 class="text-2xl font-bold">❄️ งานที่ต้องดำเนินการ</h1>
      <p class="text-gray-300">บริษัท คูลเทค แอร์เซอร์วิส จำกัด</p>
    </div>
    <div class="text-right">
      <p id="userInfo" class="text-sm text-gray-300">กำลังโหลด...</p>
      <button onclick="logout()" class="mt-1 bg-red-600 hover:bg-red-700 text-white text-sm px-3 py-1 rounded">
        ออกจากระบบ
      </button>
    </div>
  </header>

  <!-- ===== ส่วนล่าง Header: แถบแผนตรวจเช็ค + เนื้อหาหลัก อยู่ข้างกัน ===== -->
  <div class="flex">

    <!-- แถบซ้ายสุด: แผนตรวจเช็คที่แอดมินประกาศไว้ (โซนแยกของตัวเอง) -->
    <aside id="scheduleSection" class="w-72 bg-sky-100 border-r-4 border-sky-300 min-h-screen p-4 flex-shrink-0 hidden">
      <h2 class="text-slate-800 font-bold text-lg mb-4">📅 แผนตรวจเช็ค</h2>
      <div id="scheduleList" class="space-y-2"></div>
    </aside>

    <!-- เนื้อหาหลัก -->
    <main class="flex-1 max-w-4xl mx-auto p-6">

      <h2 class="text-xl font-semibold text-slate-800 mb-4">เครื่องปรับอากาศที่ต้องดำเนินการ</h2>

      <!-- การ์ดงานที่ต้องซ่อมจะถูกสร้างเพิ่มตรงนี้ด้วย js -->
      <div id="unitList" class="space-y-3"></div>

      <p id="emptyMsg" class="text-gray-400 text-center py-12 hidden">🎉 ไม่มีงานค้างในขณะนี้ ทุกเครื่องอยู่ในสถานะปกติ</p>

    </main>

  </div>

  <script>
    // ===== โหลดแผนตรวจเช็คที่แอดมินประกาศไว้ มาแสดงในแถบซ้ายสุด =====
    async function loadSchedules() {
      const response = await fetch('/api/schedules');
      const data = await response.json();

      const scheduleSection = document.getElementById('scheduleSection');
      const scheduleList = document.getElementById('scheduleList');

      // ถ้าไม่มีแผนเลย ไม่ต้องแสดงแถบนี้เลย
      if (data.length === 0) {
        scheduleSection.classList.add('hidden');
        return;
      }

      scheduleSection.classList.remove('hidden');
      scheduleList.innerHTML = '';

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-lg shadow p-3 border border-sky-200';
        card.innerHTML = `
          <p class="font-semibold text-slate-800 text-sm">${item.client_company}</p>
          <p class="text-sm text-sky-700">วันที่ ${item.scheduled_date}</p>
          ${item.note ? `<p class="text-xs text-gray-500 mt-1">${item.note}</p>` : ''}
        `;
        scheduleList.appendChild(card);
      });
    }

    // ===== โหลดเครื่องที่ต้องซ่อม/รอเปลี่ยน ทุกบริษัท =====
    async function loadUnits() {
      const response = await fetch('/api/ac-units/need-attention');
      const data = await response.json();

      const unitList = document.getElementById('unitList');
      const emptyMsg = document.getElementById('emptyMsg');
      unitList.innerHTML = '';

      if (data.length === 0) {
        emptyMsg.classList.remove('hidden');
        return;
      }
      emptyMsg.classList.add('hidden');

      data.forEach(item => {
        const statusColor = item.status === 'ต้องซ่อม'
          ? 'bg-red-100 text-red-700'
          : 'bg-yellow-100 text-yellow-700';

        const noteBox = item.note
          ? `<p class="text-sm text-orange-700 bg-orange-50 border border-orange-200 rounded px-2 py-1 mt-2">📝 ${item.note}</p>`
          : '';

        const card = document.createElement('a');
        card.href = `maintenance.html?id=${item.id}&code=${encodeURIComponent(item.code)}`;
        card.className = 'bg-white rounded-lg shadow p-4 flex justify-between items-center hover:shadow-lg transition block';

        card.innerHTML = `
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-semibold text-slate-800">${item.code}</span>
              <span class="px-2 py-1 rounded-full text-xs ${statusColor}">${item.status}</span>
            </div>
            <p class="text-sm text-gray-600">${item.client_company}</p>
            <p class="text-sm text-gray-400">${item.location || '-'}</p>
            <p class="text-sm text-gray-500 mt-1">${item.brand || '-'} · ${item.btu_size ? item.btu_size + ' BTU' : '-'}</p>
            ${noteBox}
          </div>
          <span class="text-gray-400">&rarr;</span>
        `;
        unitList.appendChild(card);
      });
    }

    // ===== เช็ค login =====
    async function checkAuth() {
      const response = await fetch('/api/me');

      if (!response.ok) {
        window.location.href = 'login.html';
        return;
      }

      const user = await response.json();
      document.getElementById('userInfo').textContent = `${user.full_name} (ช่างซ่อมบำรุง)`;

      loadSchedules();
      loadUnits();
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = 'login.html';
    }

    checkAuth();

    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        checkAuth();
      }
    });
  </script>

</body>
</html>

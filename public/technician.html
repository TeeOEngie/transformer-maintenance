<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>งานที่ต้องดำเนินการ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
    .hover-lift {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hover-lift:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-sky-50 min-h-screen">

  <!-- header เต็มความกว้าง อยู่บนสุดเหมือนหน้าอื่น -->
  <header class="bg-black text-sky-400 p-6 shadow-md flex justify-between items-center border-b-4 border-sky-500">
    <div class="flex items-center gap-3">
      <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z" />
      </svg>
      <div>
        <h1 class="text-2xl font-bold">ระบบเก็บประวัติการซ่อมเครื่องปรับอากาศ</h1>
        <p class="text-gray-300 text-sm">บริษัท คูลเทค แอร์เซอร์วิส จำกัด</p>
      </div>
    </div>
    <!-- โปรไฟล์ช่าง + ปุ่ม logout ชิดขวาสุด -->
    <div>
      <div class="flex items-center gap-3 mb-2">
        <div class="w-9 h-9 rounded-full bg-sky-500 flex items-center justify-center font-bold text-black flex-shrink-0">
          T
        </div>
        <div>
          <p id="userInfo" class="text-sm font-medium text-white">กำลังโหลด...</p>
          <p class="text-xs text-gray-400">ช่างซ่อมบำรุง</p>
        </div>
      </div>
      <div class="flex justify-end">
        <button onclick="logout()" class="flex items-center gap-2 text-sm text-gray-400 hover:text-red-400 transition">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          ออกจากระบบ
        </button>
      </div>
    </div>
  </header>

  <!-- แถบแผนตรวจเช็คแยกโซนซ้ายสุด + เนื้อหาหลักด้านขวา -->
  <div class="flex">

    <aside id="scheduleSection" class="w-72 bg-sky-100 min-h-screen p-4 flex-shrink-0 hidden">
      <h2 class="text-slate-800 font-bold text-lg mb-4 flex items-center gap-2">
        <svg class="w-5 h-5 text-sky-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        แผนตรวจเช็ค
      </h2>
      <div id="scheduleList" class="space-y-2"></div>
    </aside>

    <main class="flex-1 max-w-4xl mx-auto p-6">

      <h2 class="text-xl font-semibold text-slate-800 mb-4">เครื่องปรับอากาศที่ต้องดำเนินการ</h2>

      <div id="unitList" class="space-y-3"></div>

      <!-- โชว์แบบนี้ตอนไม่มีงานค้างเลย ให้รู้สึกดีกว่าเห็นหน้าว่างเปล่าเฉยๆ -->
      <div id="emptyMsg" class="text-gray-400 text-center py-12 hidden">
        <svg class="w-12 h-12 mx-auto mb-2 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        ไม่มีงานค้างในขณะนี้ ทุกเครื่องอยู่ในสถานะปกติ
      </div>

    </main>

  </div>

  <script>
    // ดึงแผนตรวจเช็คมาโชว์ ถ้าไม่มีเลยก็ซ่อนแถบนี้ไปเลย ไม่เปลืองพื้นที่
    async function loadSchedules() {
      const response = await fetch('/api/schedules');
      const data = await response.json();

      const scheduleSection = document.getElementById('scheduleSection');
      const scheduleList = document.getElementById('scheduleList');

      if (data.length === 0) {
        scheduleSection.classList.add('hidden');
        return;
      }

      scheduleSection.classList.remove('hidden');
      scheduleList.innerHTML = '';

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-lg shadow p-3 border border-sky-200';
        card.innerHTML = `
          <p class="font-semibold text-slate-800 text-sm">${item.client_company}</p>
          <p class="text-sm text-sky-700">วันที่ ${item.scheduled_date}</p>
          ${item.note ? `<p class="text-xs text-gray-500 mt-1">${item.note}</p>` : ''}
        `;
        scheduleList.appendChild(card);
      });
    }

    // ดึงเครื่องที่ต้องซ่อม/รอเปลี่ยนทุกบริษัท ให้ช่างเห็นงานที่ต้องทำวันนี้
    async function loadUnits() {
      const response = await fetch('/api/ac-units/need-attention');
      const data = await response.json();

      const unitList = document.getElementById('unitList');
      const emptyMsg = document.getElementById('emptyMsg');
      unitList.innerHTML = '';

      if (data.length === 0) {
        emptyMsg.classList.remove('hidden');
        return;
      }
      emptyMsg.classList.add('hidden');

      data.forEach(item => {
        const statusColor = item.status === 'ต้องซ่อม'
          ? 'bg-red-100 text-red-700'
          : 'bg-yellow-100 text-yellow-700';

        // ถ้าแอดมินเขียนหมายเหตุไว้ตอนเปลี่ยนสถานะ ก็โชว์ให้ช่างเห็นตรงนี้
        const noteBox = item.note
          ? `<p class="text-sm text-orange-700 bg-orange-50 border border-orange-200 rounded px-2 py-1 mt-2">${item.note}</p>`
          : '';

        const card = document.createElement('a');
        card.href = `maintenance.html?id=${item.id}&code=${encodeURIComponent(item.code)}`;
        card.className = 'hover-lift bg-white rounded-lg shadow p-4 flex justify-between items-center transition block';

        card.innerHTML = `
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-semibold text-slate-800">${item.code}</span>
              <span class="px-2 py-1 rounded-full text-xs ${statusColor}">${item.status}</span>
            </div>
            <p class="text-sm text-gray-600">${item.client_company}</p>
            <p class="text-sm text-gray-400">${item.location || '-'}</p>
            <p class="text-sm text-gray-500 mt-1">${item.brand || '-'} · ${item.btu_size ? item.btu_size + ' BTU' : '-'}</p>
            ${noteBox}
          </div>
          <svg class="w-5 h-5 text-gray-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        `;
        unitList.appendChild(card);
      });
    }

    async function checkAuth() {
      const response = await fetch('/api/me');

      if (!response.ok) {
        window.location.href = 'login.html';
        return;
      }

      const user = await response.json();
      document.getElementById('userInfo').textContent = user.full_name;

      loadSchedules();
      loadUnits();
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = 'login.html';
    }

    checkAuth();

    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        checkAuth();
      }
    });
  </script>

</body>
</html>

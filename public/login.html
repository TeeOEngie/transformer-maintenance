<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เข้าสู่ระบบ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-100 min-h-screen flex items-center justify-center">

  <!-- กล่อง login ตรงกลางจอ -->
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md border-t-4 border-sky-500">
    <h1 class="text-xl font-bold text-center mb-1">❄️ ระบบจัดการงานซ่อมเครื่องปรับอากาศ</h1>
    <p class="text-center text-gray-500 text-sm mb-6">บริษัท คูลเทค แอร์เซอร์วิส จำกัด</p>

    <!-- ข้อความ error จะโผล่ตรงนี้ถ้า login ไม่ผ่าน -->
    <p id="errorMsg" class="text-red-600 text-sm mb-3 hidden"></p>

    <form id="loginForm" class="space-y-3">
      <div>
        <label class="block text-sm text-gray-600 mb-1">Username</label>
        <input type="text" id="username" required class="w-full border rounded px-3 py-2">
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Password</label>
        <div class="relative">
          <input type="password" id="password" required class="w-full border rounded px-3 py-2 pr-10">
          <!-- ปุ่มรูปตา กดสลับโชว์/ซ่อนรหัสผ่าน -->
          <button type="button" onclick="togglePassword()" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500">
            <span id="eyeIcon">👁️</span>
          </button>
        </div>
      </div>
      <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 text-black font-semibold py-2 rounded">
        เข้าสู่ระบบ
      </button>
    </form>
  </div>

  <script>
    // สลับโชว์/ซ่อนรหัสผ่านในช่อง password
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.textContent = '🙈';
      } else {
        passwordInput.type = 'password';
        eyeIcon.textContent = '👁️';
      }
    }

    // ===== ตอนกด submit ฟอร์ม login =====
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // ส่ง username/password ไปเช็คที่ backend
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });

      const result = await response.json();
      const errorMsg = document.getElementById('errorMsg');

      if (!response.ok) {
        errorMsg.textContent = result.error;
        errorMsg.classList.remove('hidden');
        return;
      }

      // login ผ่านแล้ว เช็ค role แล้วพาไปคนละหน้ากัน
      if (result.user.role === 'admin') {
        window.location.href = 'index.html';
      } else {
        window.location.href = 'technician.html';
      }
    });
  </script>

</body>
</html>

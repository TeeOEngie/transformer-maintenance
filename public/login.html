<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เข้าสู่ระบบ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }

    /* การ์ดทุกใบ ยกตัวขึ้นเล็กน้อยตอน hover */
    .hover-lift {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hover-lift:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-sky-50 min-h-screen flex items-center justify-center">

  <!-- กล่อง login ตรงกลางจอ -->
  <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md border-t-4 border-sky-500">

    <!-- ไอคอนหิมะ/แอร์อยู่บนสุด แทนที่ emoji เดิม -->
    <div class="flex justify-center mb-3">
      <svg class="w-10 h-10 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z" />
      </svg>
    </div>

    <h1 class="text-xl font-bold text-center mb-1">ระบบเก็บประวัติการซ่อมเครื่องปรับอากาศ</h1>
    <p class="text-center text-gray-500 text-sm mb-6">บริษัท คูลเทค แอร์เซอร์วิส จำกัด</p>

    <!-- ตรงนี้จะโชว์ error ถ้า login ไม่ผ่าน -->
    <p id="errorMsg" class="text-red-600 text-sm mb-3 hidden"></p>

    <form id="loginForm" class="space-y-3">
      <div>
        <label class="block text-sm text-gray-600 mb-1">Username</label>
        <input type="text" id="username" required class="w-full border rounded px-3 py-2">
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Password</label>
        <div class="relative">
          <input type="password" id="password" required class="w-full border rounded px-3 py-2 pr-10">
          <!-- ปุ่มไอคอนตา กดสลับโชว์/ซ่อนรหัสผ่าน -->
          <button type="button" onclick="togglePassword()" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500">
            <svg id="eyeIconOpen" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg id="eyeIconClosed" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21" />
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 text-black font-semibold py-2 rounded transition">
        เข้าสู่ระบบ
      </button>
    </form>
  </div>

  <script>
    // สลับโชว์/ซ่อนรหัสผ่าน แค่เปลี่ยน type ของ input กับสลับไอคอนตา
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeOpen = document.getElementById('eyeIconOpen');
      const eyeClosed = document.getElementById('eyeIconClosed');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeOpen.classList.add('hidden');
        eyeClosed.classList.remove('hidden');
      } else {
        passwordInput.type = 'password';
        eyeOpen.classList.remove('hidden');
        eyeClosed.classList.add('hidden');
      }
    }

    // ตอนกด submit ฟอร์ม login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // ส่งไปเช็คที่ backend
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });

      const result = await response.json();
      const errorMsg = document.getElementById('errorMsg');

      if (!response.ok) {
        errorMsg.textContent = result.error;
        errorMsg.classList.remove('hidden');
        return;
      }

      // login ผ่านแล้ว เช็ค role แล้วพาไปคนละหน้ากัน
      if (result.user.role === 'admin') {
        window.location.href = 'index.html';
      } else {
        window.location.href = 'technician.html';
      }
    });
  </script>

</body>
</html>

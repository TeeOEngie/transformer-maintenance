<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เครื่องปรับอากาศ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
    .hover-lift {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hover-lift:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    /* ปุ่มหลักของระบบ: พื้นฟ้า ตัวดำหนา ชี้แล้วเป็นพื้นดำ ตัวฟ้า */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #38bdf8;                    /* ฟ้าเดียวกับโลโก้ CoolTrack */
      color: #000;
      font-weight: 700;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      box-shadow: inset 0 0 0 1.5px #38bdf8;  /* ขอบฟ้า (กลืนตอนปกติ เห็นเป็นกรอบตอนเป็นพื้นดำ) */
      white-space: nowrap;                    /* ข้อความไม่ตกบรรทัด */
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn-primary:hover {
      background: #000;
      color: #38bdf8;
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    /* ให้คลาส hidden ของ Tailwind ยังซ่อนปุ่มได้ (ใช้ซ่อนปุ่มเพิ่มตอนช่าง login) */
    .btn-primary.hidden {
      display: none;
    }
    .btn-primary svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="bg-sky-50 min-h-screen">

  <!-- หน้านี้อยู่ลึกกว่าหน้าอื่น (กดจากบริษัทเข้ามา) เลยไม่มี sidebar เต็มรูปแบบ ใช้ปุ่มกลับแทน -->
  <header class="bg-black text-sky-400 p-6 shadow-md border-b-4 border-sky-500 flex justify-between items-center">
    <div>
      <a href="index.html" class="text-gray-300 text-sm hover:underline">&larr; กลับหน้ารายชื่อบริษัท</a>
      <h1 id="pageTitle" class="text-2xl font-bold mt-1">เครื่องปรับอากาศ</h1>
    </div>
    <!-- โปรไฟล์ผู้ใช้ อยู่มุมขวาของ header แทน sidebar -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-sky-500 flex items-center justify-center font-bold text-black flex-shrink-0">
        <span id="userInitial">-</span>
      </div>
      <div>
        <p id="userInfo" class="text-sm font-medium text-white">กำลังโหลด...</p>
        <p id="userRole" class="text-xs text-gray-300"></p>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6">

    <!-- การ์ดสรุปตัวเลขของบริษัทนี้โดยเฉพาะ -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white rounded-lg shadow p-4 border-l-4 border-blue-500">
        <p class="text-gray-500 text-sm">เครื่องทั้งหมด</p>
        <p id="totalCount" class="text-3xl font-bold text-slate-800">-</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4 border-l-4 border-green-500">
        <p class="text-gray-500 text-sm">สถานะปกติ</p>
        <p id="normalCount" class="text-3xl font-bold text-green-600">-</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4 border-l-4 border-red-500">
        <p class="text-gray-500 text-sm">ต้องซ่อม / รอเปลี่ยน</p>
        <p id="issueCount" class="text-3xl font-bold text-red-600">-</p>
      </div>
    </div>

    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold text-slate-800">รายการเครื่องปรับอากาศ</h2>
      <!-- ปุ่มหลัก + ไอคอนบวก (ซ่อนอัตโนมัติถ้า login เป็นช่าง) -->
      <button id="addBtn" onclick="openAddModal()" class="btn-primary">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
        เพิ่มเครื่องแอร์
      </button>
    </div>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
      <table class="w-full text-left">
        <thead class="bg-black text-sky-400">
          <tr>
            <th class="p-3">รหัส</th>
            <th class="p-3">ตำแหน่งติดตั้ง</th>
            <th class="p-3">ยี่ห้อ</th>
            <th class="p-3">ขนาด (BTU)</th>
            <th class="p-3">ชนิด</th>
            <!-- [ใหม่] คอลัมน์วันที่ติดตั้ง -->
            <th class="p-3 whitespace-nowrap">วันที่ติดตั้ง</th>
            <th class="p-3">สถานะ</th>
            <th class="p-3">จัดการ</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- แถวข้อมูลจะถูกสร้างเพิ่มตรงนี้ด้วย js -->
        </tbody>
      </table>
    </div>

  </main>

  <!-- modal ฟอร์มเพิ่ม/แก้ไข เครื่องแอร์ -->
  <div id="formModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
      <h3 id="modalTitle" class="text-lg font-semibold mb-4">เพิ่มเครื่องแอร์ใหม่</h3>

      <form id="unitForm" class="space-y-3">
        <!-- ช่องนี้ผู้ใช้ไม่เห็น เก็บ id ไว้เผื่อเป็นการแก้ไข -->
        <input type="hidden" id="formId">

        <div>
          <label class="block text-sm text-gray-600 mb-1">รหัสเครื่อง</label>
          <input type="text" id="formCode" required class="w-full border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">ตำแหน่งติดตั้ง</label>
          <input type="text" id="formLocation" placeholder="เช่น ชั้น 3 ห้องประชุม" class="w-full border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">ยี่ห้อ</label>
          <input type="text" id="formBrand" class="w-full border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">ขนาด (BTU)</label>
          <input type="number" id="formBtu" class="w-full border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">ชนิด</label>
          <select id="formType" class="w-full border rounded px-3 py-2">
            <option value="ผนัง">ผนัง</option>
            <option value="ตั้งพื้น">ตั้งพื้น</option>
            <option value="แขวนฝ้า">แขวนฝ้า</option>
            <option value="ท่อ">ท่อ</option>
          </select>
        </div>
        <!-- [ใหม่] ช่องวันที่ติดตั้ง (เว้นว่างได้ ถ้าไม่รู้) -->
        <div>
          <label class="block text-sm text-gray-600 mb-1">วันที่ติดตั้ง</label>
          <input type="date" id="formInstallDate" class="w-full border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">สถานะ</label>
          <select id="formStatus" class="w-full border rounded px-3 py-2">
            <option value="ปกติ">ปกติ</option>
            <option value="ต้องซ่อม">ต้องซ่อม</option>
            <option value="รอเปลี่ยน">รอเปลี่ยน</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">หมายเหตุถึงช่าง (รายละเอียดที่ต้องซ่อม)</label>
          <textarea id="formNote" rows="2" placeholder="ปัญหา" class="w-full border rounded px-3 py-2"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded border">ยกเลิก</button>
          <!-- ปุ่มบันทึกในฟอร์ม ใช้แบบเดียวกับปุ่มยกเลิก -->
          <button type="submit" class="px-4 py-2 rounded border">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // เอาชื่อบริษัทจาก url ที่ส่งมาจากหน้ารายชื่อบริษัท
    const urlParams = new URLSearchParams(window.location.search);
    const companyName = urlParams.get('company');

    // เก็บข้อมูลเครื่องทั้งหมดไว้ตรงนี้ เผื่อกดแก้ไขจะได้ดึงมาเติมฟอร์มได้
    let unitsData = [];
    let currentUserRole = null;

    document.getElementById('pageTitle').textContent = `เครื่องปรับอากาศ: ${companyName || ''}`;

    // [ใหม่] แปลง 2024-01-15 เป็น "15 ม.ค. 2567" (ถ้าไม่มีวันที่ โชว์ขีด)
    function thaiDate(dateStr) {
      if (!dateStr) return '-';
      return new Date(dateStr + 'T00:00:00').toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    async function loadUnits() {
      const response = await fetch(`/api/ac-units/company/${encodeURIComponent(companyName)}`);
      const data = await response.json();
      unitsData = data;

      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      let normal = 0;
      let issue = 0;

      data.forEach(item => {
        if (item.status === 'ปกติ') normal++;
        else issue++;

        let statusColor = 'bg-green-100 text-green-700';
        if (item.status === 'ต้องซ่อม') statusColor = 'bg-red-100 text-red-700';
        else if (item.status === 'รอเปลี่ยน') statusColor = 'bg-yellow-100 text-yellow-700';

        const row = document.createElement('tr');
        row.className = 'border-b hover:bg-gray-50';
        row.innerHTML = `
          <td class="p-3">${item.code}</td>
          <td class="p-3">${item.location || '-'}</td>
          <td class="p-3">${item.brand || '-'}</td>
          <td class="p-3">${item.btu_size || '-'}</td>
          <td class="p-3">${item.ac_type || '-'}</td>
          <td class="p-3 whitespace-nowrap">${thaiDate(item.install_date)}</td>
          <td class="p-3"><span class="px-2 py-1 rounded-full text-xs ${statusColor}">${item.status}</span></td>
          <td class="p-3">
            <div class="flex items-center gap-3">
              <a href="maintenance.html?id=${item.id}&code=${encodeURIComponent(item.code)}" class="flex items-center gap-1 text-green-600 hover:text-green-700 transition whitespace-nowrap">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                </svg>
                ประวัติซ่อม
              </a>
              ${currentUserRole === 'admin' ? `
                <button onclick="openEditModal(${item.id})" class="flex items-center gap-1 text-sky-700 hover:text-sky-800 transition whitespace-nowrap">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                  </svg>
                  แก้ไข
                </button>
                <button onclick="deleteUnit(${item.id})" class="flex items-center gap-1 text-red-600 hover:text-red-700 transition whitespace-nowrap">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                  ลบ
                </button>
              ` : ''}
            </div>
          </td>
        `;
        tableBody.appendChild(row);
      });

      document.getElementById('totalCount').textContent = data.length;
      document.getElementById('normalCount').textContent = normal;
      document.getElementById('issueCount').textContent = issue;
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'เพิ่มเครื่องแอร์ใหม่';
      document.getElementById('unitForm').reset();
      document.getElementById('formId').value = '';
      document.getElementById('formModal').classList.remove('hidden');
    }

    function openEditModal(id) {
      const item = unitsData.find(u => u.id === id);
      document.getElementById('modalTitle').textContent = 'แก้ไขข้อมูลเครื่องแอร์';
      document.getElementById('formId').value = item.id;
      document.getElementById('formCode').value = item.code;
      document.getElementById('formLocation').value = item.location || '';
      document.getElementById('formBrand').value = item.brand || '';
      document.getElementById('formBtu').value = item.btu_size || '';
      document.getElementById('formType').value = item.ac_type || 'ผนัง';
      document.getElementById('formInstallDate').value = item.install_date || ''; // [ใหม่]
      document.getElementById('formStatus').value = item.status;
      document.getElementById('formNote').value = item.note || '';
      document.getElementById('formModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('formModal').classList.add('hidden');
    }

    document.getElementById('unitForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('formId').value;

      const payload = {
        code: document.getElementById('formCode').value,
        client_company: companyName,
        location: document.getElementById('formLocation').value,
        brand: document.getElementById('formBrand').value,
        btu_size: document.getElementById('formBtu').value,
        ac_type: document.getElementById('formType').value,
        // [ใหม่] ถ้าไม่ได้เลือกวันที่ ส่ง null (ส่งข้อความว่างเข้าคอลัมน์ DATE จะ error)
        install_date: document.getElementById('formInstallDate').value || null,
        status: document.getElementById('formStatus').value,
        note: document.getElementById('formNote').value,
      };

      if (id) {
        await fetch(`/api/ac-units/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
      } else {
        await fetch('/api/ac-units', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
      }

      closeModal();
      loadUnits();
    });

    async function deleteUnit(id) {
      if (!confirm('ยืนยันการลบข้อมูลนี้หรือไม่?')) return;
      await fetch(`/api/ac-units/${id}`, { method: 'DELETE' });
      loadUnits();
    }

    async function checkAuth() {
      const response = await fetch('/api/me');
      if (!response.ok) {
        window.location.href = 'login.html';
        return;
      }
      const user = await response.json();
      currentUserRole = user.role;

      document.getElementById('userInfo').textContent = user.full_name;
      document.getElementById('userRole').textContent = user.role === 'admin' ? 'แอดมิน' : 'ช่างซ่อมบำรุง';
      document.getElementById('userInitial').textContent = user.role === 'admin' ? 'A' : 'T';

      // ช่างไม่ควรแก้ไข/ลบข้อมูลเครื่องได้ ซ่อนปุ่มเพิ่มไปเลย
      if (currentUserRole !== 'admin') {
        document.getElementById('addBtn').classList.add('hidden');
      }

      loadUnits();
    }

    checkAuth();

    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        checkAuth();
      }
    });
  </script>

</body>
</html>
